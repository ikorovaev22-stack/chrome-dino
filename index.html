<!doctype html>
<html lang="ru" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0e14">
  <!-- Added to the home screen, the game opens without the browser's bars. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Дино-забег">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="description" content="Пиксельный забег динозаврика по пяти мирам: сердца, монеты, улучшения, скины, день и ночь. По мотивам офлайн-игры Chrome.">
  <title>Дино-забег</title>
  <link rel="icon" type="image/png" href="./src/images/default_100_percent/offline/100-error-offline.png">
  <script>
    // Old links to the Chrome copy: ?classic or #classic.
    if (/[?&]classic\b/.test(location.search) || location.hash === '#classic') {
      location.replace('classic.html' + location.search.replace(/[?&]classic\b/, '').replace(/^&/, '?'));
    }
  </script>
  <script type="module" src="./src/game_main.ts"></script>
</head>
<body>
  <main class="viewport" id="viewport" aria-label="Игра «Дино-забег»">
    <div class="world" id="world">
      <canvas class="layer" id="scene" aria-hidden="true"></canvas>
      <div id="stage"></div>
      <canvas class="layer light" id="shade" aria-hidden="true"></canvas>
      <canvas class="layer light" id="glow" aria-hidden="true"></canvas>
      <canvas class="layer" id="fx" aria-hidden="true"></canvas>
      <button class="pause" id="pause" type="button" aria-label="Пауза" hidden>
        <span></span><span></span>
      </button>
    </div>
    <p class="loading" id="loading">Загрузка…</p>
  </main>
  <p class="rotate-hint">Поверните телефон — так экран больше</p>

  <footer class="footer">
    <a href="./classic.html">Классическая версия из Chrome</a>
    <a href="https://github.com/ikorovaev22-stack/chrome-dino">Исходный код</a>
  </footer>

  <div class="icon-offline" hidden></div>
  <div id="offline-resources" hidden>
    <template id="audio-resources">
      <audio id="offline-sound-press" src="./src/sounds/button-press.mp3"></audio>
      <audio id="offline-sound-hit" src="./src/sounds/hit.mp3"></audio>
      <audio id="offline-sound-reached" src="./src/sounds/score-reached.mp3"></audio>
    </template>
  </div>
</body>
</html>
